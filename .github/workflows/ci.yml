name: CI

# Kiểm tra nhanh mỗi lần push lên main hoặc mở Pull Request (chỉ chạy trên Linux).
# Build bộ cài đầy đủ nằm ở workflow "Build installers" (chỉ chạy khi gắn tag v*).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, build frontend, Rust tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (TypeScript)
        run: pnpm exec tsc --noEmit

      # Tauri đọc thư mục ../out (frontendDist) lúc biên dịch Rust nên phải build frontend trước
      - name: Build frontend (Next.js static export)
        run: pnpm build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
